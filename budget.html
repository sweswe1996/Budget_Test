<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Budget Limits Entry — BudgetTracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/forms.css">
</head>
<body>

  <!-- Top Executive Navigation Bar -->
  <nav class="entry-top-nav">
    <div class="nav-brand-group">
      <a class="btn-nav-hub" href="./home.html">← Hub</a>
      <div class="nav-brand-text">BudgetTracker <span>Budget Planning</span></div>
    </div>

    <!-- Center Title Group in Nav -->
    <div class="nav-center-title-group">
      <div class="nav-header-main-title">◔ Monthly Budget Planning</div>
    </div>

    <div class="nav-right-group">
      <button class="btn-theme-toggle" id="themeToggleBtn">☀️ Light</button>
    </div>
  </nav>

  <div class="entry-page-wrapper">
    <!-- Main Budget Entry Form Card -->
    <section class="entry-form-card theme-Budget">
      <div class="form-card-header">
        <div class="form-header-icon">◔</div>
        <div>
          <h2 class="form-header-title">Set Monthly Budget Limit</h2>
          <p class="form-header-sub">Configure spending caps for the upcoming calendar period.</p>
        </div>
      </div>

      <div class="form-card-body">
        <form id="budgetForm" onsubmit="submitBudget(event)">
          <input type="hidden" name="formType" value="Budgets">

          <div class="form-grid">
            <div class="field-group">
              <label class="field-label req" for="budgetMonth">Budget Month</label>
              <input type="month" id="budgetMonth" name="budgetMonth" class="form-input" required>
            </div>

            <div class="field-group">
              <label class="field-label req" for="budgetCategory">Expense Category</label>
              <select id="budgetCategory" name="budgetCategory" class="form-select" onchange="handleCategoryChange()" required></select>
            </div>

            <div class="field-group">
              <label class="field-label req" for="budgetAmount">Planned Budget Limit</label>
              <div class="amount-input-group">
                <input type="number" id="budgetAmount" name="budgetAmount" class="form-input" step="1" placeholder="e.g. 50000" required>
                <select id="budgetCurrency" name="budgetCurrency" class="form-select" required>
                  <option value="JPY" selected>JPY</option>
                  <option value="MMK">MMK</option>
                  <option value="USD">USD</option>
                </select>
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="budgetPriority">Priority / Flexibility</label>
              <select id="budgetPriority" name="budgetPriority" class="form-select">
                <option value="Fixed">🔒 Fixed / Strict Limit</option>
                <option value="Flexible" selected>⚖️ Flexible Target</option>
                <option value="Discretionary">🎈 Discretionary Spend</option>
              </select>
            </div>

            <div class="field-group full-width">
              <label class="field-label" for="budgetNotes">Strategy Notes / Rationales</label>
              <textarea id="budgetNotes" name="budgetNotes" class="form-textarea" placeholder="e.g., Summer electricity allowance, dining out budget cap..."></textarea>
            </div>
          </div>

          <div class="form-actions-row">
            <button type="button" class="btn-form-clear" onclick="resetBudgetForm()">Clear Form</button>
            <button id="saveBtn" type="submit" class="btn-form-save">Save Budget Limit</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Active Monthly Budget Limits Overview (Default Collapsed with Show/Hide Header) -->
    <section class="recent-entries-section" id="budgetEntriesSection">
      <div class="recent-section-header" onclick="toggleBudgetVisibility()" title="Click to view Active Budget Targets">
        <div class="recent-section-title-wrap">
          <div class="recent-section-icon-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
          </div>
          <h3 class="recent-section-title">Active Budget Targets</h3>
          <span class="recent-count-pill" id="budgetCountBadge">12</span>
        </div>
        <div class="recent-toggle-chevron" id="budgetChevronIcon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>

      <!-- Collapsible Container (Default Hidden) -->
      <div id="budgetCollapsibleContent" class="recent-cards-list">
        <!-- Month selector & Planned badge single-row toolbar -->
        <div class="budget-sub-toolbar">
          <div class="budget-month-picker-pill">
            <span class="month-picker-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </span>
            <select id="tableMonthSelector" class="budget-month-select" onchange="onTableMonthChange(this.value)">
              <option value="2026-08" selected>Aug 2026</option>
              <option value="2026-07">Jul 2026</option>
              <option value="2026-06">Jun 2026</option>
              <option value="2026-05">May 2026</option>
              <option value="2026-04">Apr 2026</option>
              <option value="2026-03">Mar 2026</option>
              <option value="2026-02">Feb 2026</option>
              <option value="2026-01">Jan 2026</option>
              <option value="2025-12">Dec 2025</option>
            </select>
            <span class="month-picker-chevron">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
          </div>

          <div class="budget-planned-pill">
            <span class="planned-pill-label">Planned:</span>
            <span id="totalPlannedBadge">¥292,000</span>
          </div>
        </div>

        <!-- Priority Filter Tabs (Matching Reference UI) -->
        <div class="budget-tabs-nav">
          <button type="button" class="budget-tab-btn active" data-priority="all" onclick="filterBudgetByPriority('all')">All Categories</button>
          <button type="button" class="budget-tab-btn" data-priority="Fixed" onclick="filterBudgetByPriority('Fixed')">Fixed</button>
          <button type="button" class="budget-tab-btn" data-priority="Flexible" onclick="filterBudgetByPriority('Flexible')">Flexible</button>
          <button type="button" class="budget-tab-btn" data-priority="Discretionary" onclick="filterBudgetByPriority('Discretionary')">Discretionary</button>
        </div>

        <!-- Modern Category Budget Cards Grid -->
        <div class="budget-cards-grid" id="budgetCardsGrid">
          <!-- Populated dynamically by renderAllBudgetCategories() -->
        </div>
      </div>
    </section>
  </div>

  <!-- ============================================================
       MOBILE FLOATING BOTTOM NAVIGATION (< 1024px)
       ============================================================ -->
  <nav class="mobile-bottom-nav">
    <a class="bottom-nav-item" href="./input.html" title="Transaction Data Entry">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="13" y2="15"/></svg>
      <span>Transactions</span>
    </a>
    <a class="bottom-nav-item active" href="./budget.html" title="Budget Entry">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
      <span>Budget</span>
      <span class="nav-indicator-dot"></span>
    </a>
    <a class="bottom-nav-item" href="./goal.html" title="Goal Entry">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      <span>Goal</span>
    </a>
    <a class="bottom-nav-item" href="./schedule.html" title="Payment Schedule Entry">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Payment</span>
    </a>
    <a class="bottom-nav-item" href="./settings.html" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Setting</span>
    </a>
  </nav>

  <div id="toast" class="toast"></div>

  <script src="./js/dashboard-data.js"></script>
  <script src="./js/calculations.js"></script>
  <script src="./js/common-forms.js"></script>
  <script>
    const CATEGORY_CONFIG = {
      Fixed_Expenses: { name: 'Fixed Expenses', icon: '🏠', priority: 'Fixed', defaultBudget: 0, defaultSpent: 0 },
      Bills_Utilities: { name: 'Bills Utilities', icon: '⚡', priority: 'Fixed', defaultBudget: 0, defaultSpent: 0 },
      Taxes_Insurance: { name: 'Taxes Insurance', icon: '📑', priority: 'Fixed', defaultBudget: 0, defaultSpent: 0 },
      Food_Expenses: { name: 'Food Expenses', icon: '🥗', priority: 'Flexible', defaultBudget: 0, defaultSpent: 0 },
      Living_Expenses: { name: 'Living Expenses', icon: '🛋️', priority: 'Flexible', defaultBudget: 0, defaultSpent: 0 },
      Entertainment: { name: 'Entertainment', icon: '🎮', priority: 'Flexible', defaultBudget: 0, defaultSpent: 0 },
      Fashion_Expenses: { name: 'Fashion Expenses', icon: '👕', priority: 'Flexible', defaultBudget: 0, defaultSpent: 0 },
      Work_Expenses: { name: 'Work Expenses', icon: '💼', priority: 'Flexible', defaultBudget: 0, defaultSpent: 0 },
      Education_Expenses: { name: 'Education Expenses', icon: '🎓', priority: 'Discretionary', defaultBudget: 0, defaultSpent: 0 },
      Healthcare_Expenses: { name: 'Healthcare Expenses', icon: '💖', priority: 'Discretionary', defaultBudget: 0, defaultSpent: 0 },
      Family_Support: { name: 'Family Support', icon: '👨‍👩‍👧‍👦', priority: 'Flexible', defaultBudget: 0, defaultSpent: 0 },
      Transportation_Expenses: { name: 'Transportation Expenses', icon: '🚆', priority: 'Flexible', defaultBudget: 0, defaultSpent: 0 }
    };

    const BUDGET_CATEGORIES = Object.keys(CATEGORY_CONFIG);

    let currentPriorityFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      const monthInput = document.getElementById('budgetMonth');
      if (monthInput) {
        monthInput.value = currentMonthISO();
        monthInput.addEventListener('change', (e) => {
          const monthSelector = document.getElementById('tableMonthSelector');
          if (monthSelector) monthSelector.value = e.target.value;
          renderAllBudgetCategories();
        });
      }

      const categorySelect = document.getElementById('budgetCategory');
      if (categorySelect) {
        categorySelect.innerHTML = optionList(BUDGET_CATEGORIES, 'Select Category');
        if (BUDGET_CATEGORIES.length > 0) {
          categorySelect.value = BUDGET_CATEGORIES[0];
          handleCategoryChange();
        }
      }

      renderAllBudgetCategories();
    });

    function onTableMonthChange(val) {
      const monthInput = document.getElementById('budgetMonth');
      if (monthInput) monthInput.value = val;
      renderAllBudgetCategories();
    }

    function handleCategoryChange() {
      const category = document.getElementById('budgetCategory').value;
      const amountInput = document.getElementById('budgetAmount');
      if (CATEGORY_CONFIG[category] && CATEGORY_CONFIG[category].defaultBudget > 0) {
        amountInput.placeholder = `e.g. ${CATEGORY_CONFIG[category].defaultBudget}`;
      } else {
        amountInput.placeholder = 'e.g. 50000';
      }
    }

    function filterBudgetByPriority(priority) {
      currentPriorityFilter = priority;
      document.querySelectorAll('.budget-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.priority === priority);
      });
      renderAllBudgetCategories();
    }

    async function renderAllBudgetCategories() {
      const container = document.getElementById('budgetCardsGrid');
      if (!container) return;
      
      const month = document.getElementById('tableMonthSelector')?.value || document.getElementById('budgetMonth')?.value || currentMonthISO();

      let liveData = null;
      try {
        if (window.BudgetTrackerData) {
          liveData = await window.BudgetTrackerData.getDashboardData();
        }
      } catch (e) {
        console.warn("Live fetch error", e);
      }

      const calc = window.BudgetTrackerCalc;
      let actualMap = {};
      if (liveData && liveData.transactions && calc) {
        const budgetRes = calc.computeBudgets(liveData.transactions, liveData.budgets, 'JPY', month);
        (budgetRes.budgets || []).forEach(b => {
          actualMap[b.categoryKey] = { actual: b.actual, limit: b.budget, progress: b.progress, status: b.status };
        });
      }

      let totalPlanned = 0;
      let totalSpent = 0;
      let visibleCardsHtml = '';

      Object.entries(CATEGORY_CONFIG).forEach(([catKey, config]) => {
        // Calculate limit & actual
        const actInfo = actualMap[catKey];
        const limit = (actInfo && actInfo.limit !== undefined && actInfo.limit !== null) ? actInfo.limit : config.defaultBudget;
        const spent = (actInfo && actInfo.actual !== undefined && actInfo.actual !== null) ? actInfo.actual : config.defaultSpent;
        const priority = config.priority;

        totalPlanned += (limit || 0);
        totalSpent += (spent || 0);

        // Filter check
        if (currentPriorityFilter !== 'all' && priority !== currentPriorityFilter) {
          return;
        }

        const isBudgeted = limit > 0;
        const isOver = isBudgeted && spent > limit;
        const progressPct = isBudgeted ? Math.round((spent / limit) * 100) : 0;
        const remaining = isBudgeted ? (limit - spent) : 0;

        let subHtml = '';
        let pctHtml = '';
        let remainingHtml = '';
        let progressHtml = '';

        if (isBudgeted) {
          subHtml = `<span>¥${limit.toLocaleString()} budget</span><span class="budget-card-bullet">•</span><span>¥${spent.toLocaleString()} spent</span>`;
          
          if (isOver) {
            pctHtml = `<span class="budget-card-pct over">${progressPct}%</span>`;
            remainingHtml = `<span class="budget-card-remaining over">¥${Math.abs(remaining).toLocaleString()} over</span>`;
            progressHtml = `
              <div class="budget-progress-track">
                <div class="budget-progress-fill over" style="width: 100%;"></div>
              </div>
            `;
          } else {
            pctHtml = `<span class="budget-card-pct ${progressPct === 0 ? 'empty' : ''}">${progressPct}%</span>`;
            remainingHtml = `<span class="budget-card-remaining left">¥${remaining.toLocaleString()} left</span>`;
            progressHtml = `
              <div class="budget-progress-track">
                <div class="budget-progress-fill normal" style="width: ${Math.min(100, progressPct)}%;"></div>
              </div>
            `;
          }
        } else {
          subHtml = `<span>Not Budgeted</span>`;
          pctHtml = `<span class="budget-card-pct empty">-</span>`;
          remainingHtml = `<span class="budget-card-remaining empty">Not Budgeted</span>`;
          progressHtml = '';
        }

        visibleCardsHtml += `
          <div class="budget-card-item" onclick="editBudgetCategory(event, '${catKey}', ${limit || 0}, '${priority}')" title="Click to edit budget for ${config.name}">
            <div class="budget-card-icon-wrap">
              ${config.icon}
            </div>
            <div class="budget-card-content">
              <div class="budget-card-header-row">
                <span class="budget-card-title">${config.name}</span>
                <span class="budget-priority-pill ${priority.toLowerCase()}">${priority}</span>
              </div>
              <div class="budget-card-sub">
                ${subHtml}
              </div>
              ${progressHtml}
            </div>
            <div class="budget-card-stats">
              ${pctHtml}
              ${remainingHtml}
            </div>
            <div class="recent-menu-anchor" onclick="event.stopPropagation()">
              <button type="button" class="btn-item-more" onclick="toggleBudgetCategoryMenu(event, '${catKey}')" title="Target Actions">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <circle cx="12" cy="5" r="2.2"/>
                  <circle cx="12" cy="12" r="2.2"/>
                  <circle cx="12" cy="19" r="2.2"/>
                </svg>
              </button>
              <div class="mobile-action-menu" id="budgetMenu-${catKey}">
                <button type="button" class="action-menu-item" onclick="editBudgetCategory(event, '${catKey}', ${limit || 0}, '${priority}')">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  <span>Edit Target</span>
                </button>
                <div class="action-menu-divider"></div>
                <button type="button" class="action-menu-item text-danger" onclick="deleteBudgetCategory(event, '${catKey}')">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  <span>Delete Target</span>
                </button>
              </div>
            </div>
          </div>
        `;
      });

      if (!visibleCardsHtml) {
        visibleCardsHtml = `
          <div style="text-align:center; padding:32px 16px; color:var(--text-muted); font-size:13px; background:var(--bg-card); border-radius:14px; border:1px dashed var(--border-card);">
            No categories found under "${currentPriorityFilter}".
          </div>
        `;
      }

      container.innerHTML = visibleCardsHtml;

      const countBadge = document.getElementById('budgetCountBadge');
      if (countBadge) {
        countBadge.textContent = Object.keys(CATEGORY_CONFIG).length;
      }

      const totalBadge = document.getElementById('totalPlannedBadge');
      if (totalBadge) {
        totalBadge.textContent = `¥${totalPlanned.toLocaleString()}`;
      }
    }

    // Toggle Hide/Show Active Budget Targets (Default Collapsed)
    let isBudgetOpen = false;
    function toggleBudgetVisibility() {
      isBudgetOpen = !isBudgetOpen;
      const listEl = document.getElementById('budgetCollapsibleContent');
      const chevronEl = document.getElementById('budgetChevronIcon');

      if (listEl) {
        listEl.classList.toggle('open', isBudgetOpen);
      }
      if (chevronEl) {
        chevronEl.classList.toggle('open', isBudgetOpen);
      }

      if (isBudgetOpen) {
        renderAllBudgetCategories();
      }
    }

    // 3-Dots Action Menu Handling
    let activeBudgetMenu = null;

    function toggleBudgetCategoryMenu(event, catKey) {
      if (event) event.stopPropagation();
      const menu = document.getElementById(`budgetMenu-${catKey}`);
      if (!menu) return;

      const card = menu.closest('.budget-card-item');
      const wasOpen = menu.classList.contains('open');
      closeAllBudgetMenus();

      if (!wasOpen) {
        menu.classList.add('open');
        if (card) card.classList.add('menu-active');
        activeBudgetMenu = menu;
      }
    }

    function closeAllBudgetMenus() {
      document.querySelectorAll('.mobile-action-menu.open').forEach(m => m.classList.remove('open'));
      document.querySelectorAll('.budget-card-item.menu-active').forEach(c => c.classList.remove('menu-active'));
      activeBudgetMenu = null;
    }

    document.addEventListener('click', (e) => {
      if (activeBudgetMenu && !activeBudgetMenu.contains(e.target)) {
        closeAllBudgetMenus();
      }
    });

    function editBudgetCategory(event, catKey, currentLimit, priority) {
      if (event) event.stopPropagation();
      closeAllBudgetMenus();

      const catSelect = document.getElementById('budgetCategory');
      if (catSelect) {
        catSelect.value = catKey;
        handleCategoryChange();
      }
      const amtInput = document.getElementById('budgetAmount');
      if (amtInput) {
        amtInput.value = currentLimit > 0 ? currentLimit : '';
      }
      const prioritySelect = document.getElementById('budgetPriority');
      if (prioritySelect && priority) {
        prioritySelect.value = priority;
      }

      // Update button text to "Update Budget Limit"
      const saveBtn = document.getElementById('saveBtn');
      if (saveBtn) {
        saveBtn.textContent = 'Update Budget Limit';
      }

      document.getElementById('budgetForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (amtInput) setTimeout(() => amtInput.focus(), 250);
      showToast(`Editing ${CATEGORY_CONFIG[catKey]?.name || catKey.replace(/_/g, ' ')}`);
    }

    function deleteBudgetCategory(event, catKey) {
      if (event) event.stopPropagation();
      closeAllBudgetMenus();

      const catName = CATEGORY_CONFIG[catKey]?.name || catKey.replace(/_/g, ' ');
      if (!confirm(`Are you sure you want to reset the budget limit for "${catName}"?`)) {
        return;
      }

      if (CATEGORY_CONFIG[catKey]) {
        CATEGORY_CONFIG[catKey].defaultBudget = 0;
      }

      const currentEditingCat = document.getElementById('budgetCategory')?.value;
      if (currentEditingCat === catKey) {
        resetBudgetForm();
      }

      renderAllBudgetCategories();
      showToast(`Removed budget target for ${catName}`);

      // Sync removal to Google Apps Script backend
      const month = document.getElementById('tableMonthSelector')?.value || document.getElementById('budgetMonth')?.value || currentMonthISO();
      fetch(APPS_SCRIPT_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          budgetMonth: month,
          budgetCategory: catKey,
          budgetAmount: 0,
          budgetPriority: CATEGORY_CONFIG[catKey]?.priority || 'Flexible',
          budgetNotes: 'Deleted'
        }),
        redirect: 'follow'
      }).catch(e => console.warn('Sync delete error', e));
    }

    function resetBudgetForm() {
      document.getElementById('budgetForm').reset();
      const saveBtn = document.getElementById('saveBtn');
      if (saveBtn) {
        saveBtn.textContent = 'Save Budget Limit';
        saveBtn.disabled = false;
      }
      handleCategoryChange();
    }

    function submitBudget(event) {
      event.preventDefault();
      const form = document.getElementById('budgetForm');
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      const btn = document.getElementById('saveBtn');
      const isUpdating = btn.textContent.includes('Update');
      btn.disabled = true;
      btn.textContent = isUpdating ? 'Updating Budget...' : 'Saving Budget...';

      saveLocalRecent('budgets', data);

      if (CATEGORY_CONFIG[data.budgetCategory]) {
        CATEGORY_CONFIG[data.budgetCategory].defaultBudget = Number(data.budgetAmount) || 0;
        if (data.budgetPriority) CATEGORY_CONFIG[data.budgetCategory].priority = data.budgetPriority;
      }

      renderAllBudgetCategories();

      fetch(APPS_SCRIPT_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data),
        redirect: 'follow'
      })
      .then(res => res.json())
      .then(res => {
        btn.disabled = false;
        btn.textContent = 'Save Budget Limit';
        showToast(isUpdating ? 'Budget limit updated successfully!' : 'Budget limit saved successfully!');
        resetBudgetForm();
        renderAllBudgetCategories();
      })
      .catch(err => {
        btn.disabled = false;
        btn.textContent = 'Save Budget Limit';
        showToast('Budget saved locally & queued for sync!');
      });
    }
  </script>
</body>
</html>

      <button class="flow-tab-btn" data-flow="Transfer" onclick="switchFlow('Transfer')">
        🔄 <span>Transfer</span>
      </button>

    <!-- Main Entry Form Card -->
    <section id="card" class="entry-form-card theme-Income">
      <div class="form-card-header">
        <div id="icon" class="form-header-icon">💵</div>
        <div>
          <h2 id="title" class="form-header-title">Income Data Entry</h2>
          <p id="subtitle" class="form-header-sub">Record salary, side-business, and cash inflows.</p>
        </div>
      </div>

      <div class="form-card-body">
        <!-- Live Editing Banner (Visible when editing a submission) -->
        <div id="editingBanner" style="display:none; margin-bottom:18px; padding:10px 14px; border-radius:10px; background:rgba(37,99,235,0.08); border:1px solid rgba(37,99,235,0.25); justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">

            <span id="editingBannerText">Editing Transaction</span>

          <button type="button" onclick="cancelEdit()" style="padding:4px 10px; font-size:11px; font-weight:700; border-radius:6px; background:var(--bg-card); color:var(--text-muted); border:1px solid var(--border-card); cursor:pointer;">
            ✕ Cancel Edit

        <form id="entryForm" onsubmit="submitForm(event)">
          <div id="fields" class="form-grid"></div>

          <div class="form-actions-row">
            <button type="button" class="btn-form-clear" onclick="clearForm()">Clear Form</button>
            <button id="saveBtn" type="submit" class="btn-form-save">Save Income</button>

      </div>
    </section>

    <!-- Recent Recorded Transactions Section (Collapsible by Default with Modern Icon) -->

      <div class="recent-section-header" onclick="toggleRecentVisibility()" title="Click to view recent submissions">

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <h3 class="recent-section-title">Recent Submissions</h3>
          <span class="recent-count-pill" id="recentCountBadge">4</span>

        <div class="recent-toggle-chevron" id="recentChevronIcon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>

      <!-- Mobile Card List Container (Default Collapsed) -->
      <div id="recentCardsList" class="recent-cards-list">
        <!-- Populated dynamically by script with 3-dot action menu [Edit, Delete] -->

  <div id="toast" class="toast"></div>

  <script src="./js/common-forms.js"></script>
  <script>
    function switchFlow(flow) {
      currentFlow = flow;

      document.querySelectorAll('.flow-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.flow === flow);
      });

      const meta = FLOW_META[flow];
      document.getElementById('card').className = 'entry-form-card theme-' + flow;
      document.getElementById('icon').innerHTML = meta.icon;
      document.getElementById('title').textContent = meta.title;
      document.getElementById('subtitle').textContent = meta.subtitle;
      document.getElementById('saveBtn').textContent = meta.save;

      renderFields();
    }

    function renderFields() {
      const wrapper = document.getElementById('fields');

      const detailLabel = currentFlow === 'Income' ? 'Income Detail' : currentFlow === 'Expense' ? 'Expense Detail' : '';
      const typeLabel = currentFlow === 'Income' ? 'Income Type' : currentFlow === 'Expense' ? 'Expense Type' : 'Transfer Type';

      const detailField = currentFlow === 'Transfer' ? '' : `
        <div class="field-group">
          <label class="field-label req" for="cashFlowDetails">${detailLabel}</label>
          <select id="cashFlowDetails" class="form-select" required></select>
        </div>`;

      const noteField = `
        <div class="field-group full-width">
          <label class="field-label" for="noteToggle">Notes & Remarks</label>
          <button id="noteToggle" class="note-toggle-btn" type="button" aria-expanded="false">
            <span>+ Add optional note</span>
            <span id="noteSign">+</span>
          </button>
          <div id="noteEditor" class="note-editor-wrap">
            <textarea id="note" class="form-textarea" placeholder="Enter notes or transaction memo..."></textarea>
          </div>
        </div>`;

      const forWhoField = `
        <div class="field-group">
          <label class="field-label req" for="forWho">For Who</label>
          <select id="forWho" class="form-select" required></select>
        </div>`;

      const statusField = `
        <div class="field-group">
          <label class="field-label req" for="status">Status (Need / Want)</label>
          <select id="status" class="form-select" required></select>
        </div>`;

      let bottomFields = '';
      if (currentFlow === 'Transfer') {
        bottomFields = forWhoField + noteField;
      } else if (currentFlow === 'Expense') {
        bottomFields = forWhoField + detailField + statusField + noteField;
      } else {
        bottomFields = forWhoField + detailField + noteField;
      }

      wrapper.innerHTML = `
        <div class="field-group">
          <label class="field-label req" for="amount">Amount & Currency</label>
          <div class="amount-input-group">
            <input id="amount" class="form-input" inputmode="numeric" placeholder="e.g. 15000" autocomplete="off" required>
            <select id="currency" class="form-select" required></select>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label req" for="date">Transaction Date</label>
          <input id="date" class="form-input" type="date" required>
        </div>

        <div class="field-group">
          <label class="field-label req" for="cashFlowType">${typeLabel}</label>
          <select id="cashFlowType" class="form-select" required></select>
        </div>

        <div class="field-group">
          <label class="field-label" for="description">Description / Memo</label>
          <input id="description" list="goalSuggestions" class="form-input" type="text" placeholder="e.g. Family Emergency Fund, MacBook Pro, Groceries">
          <datalist id="goalSuggestions">
            <option value="Family Emergency Fund">
            <option value="Japan Family Vacation">
            <option value="MacBook Pro M3 / Laptop">
            <option value="Kids Education Fund">
            <option value="Home Repair & Decor">
            <option value="Stock & NISA Investment">
            <option value="Car Maintenance Fund">
            <option value="New iPhone / Mobile">
            <option value="Myanmar Family Gift">
          </datalist>
        </div>

        <div class="field-group">
          <label class="field-label req" for="fromSource">From Source Account</label>
          <select id="fromSource" class="form-select" required></select>
        </div>

        <div class="field-group">
          <label class="field-label req" for="toSource">To Source Account</label>
          <select id="toSource" class="form-select" required></select>
        </div>

        ${bottomFields}
      `;

      const amount = document.getElementById('amount');
      amount.addEventListener('input', () => {
        amount.value = amount.value.replace(/\D/g, '');
      });

      const noteToggle = document.getElementById('noteToggle');
      const noteEditor = document.getElementById('noteEditor');
      const noteSign = document.getElementById('noteSign');

      noteToggle.addEventListener('click', () => {
        const isOpen = noteEditor.classList.toggle('open');
        noteSign.textContent = isOpen ? '−' : '+';
        noteToggle.setAttribute('aria-expanded', String(isOpen));
        if (isOpen) document.getElementById('note').focus();
      });

      document.getElementById('date').value = todayISO();

      const currency = document.getElementById('currency');
      currency.innerHTML = optionList(CURRENCIES, 'Currency');
      currency.value = 'JPY';
      currency.addEventListener('change', hydrateSources);

      document.getElementById('forWho').innerHTML = optionList(FOR_WHO, 'Select For Who');
      document.getElementById('forWho').value = 'CS';

      const status = document.getElementById('status');
      if (status) {
        status.innerHTML = optionList(STATUS_LIST, 'Select Status');
        status.value = 'Need';
      }

      const type = document.getElementById('cashFlowType');
      type.innerHTML = optionList(Object.keys(TYPE_DETAILS[currentFlow]), 'Select ' + typeLabel.toLowerCase());

      if (currentFlow !== 'Transfer') {
        type.addEventListener('change', hydrateDetails);
      }

      hydrateSources();
      hydrateDetails();
    }

    function hydrateSources() {
      const currency = document.getElementById('currency').value;
      const sourceMap = currentFlow === 'Transfer' ? TRANSFER_SOURCES : ALL_SOURCES;
      const items = sourceMap[currency] || [];

      document.getElementById('fromSource').innerHTML = groupedSourceOptions(items, 'Select From Source');
      document.getElementById('toSource').innerHTML = groupedSourceOptions(items, 'Select To Source');

      if (currentFlow === 'Income') {
        document.getElementById('fromSource').value = '-';
      } else if (currentFlow === 'Expense') {
        document.getElementById('toSource').value = '-';
      }
    }

    function hydrateDetails() {
      const detail = document.getElementById('cashFlowDetails');
      if (!detail) return;

      const type = document.getElementById('cashFlowType').value;
      const items = TYPE_DETAILS[currentFlow] && TYPE_DETAILS[currentFlow][type] ? TYPE_DETAILS[currentFlow][type] : [];

      detail.innerHTML = optionList(items, type ? 'Select detail' : 'Select type first');
    }

    function collectData() {
      const val = id => {
        const el = document.getElementById(id);
        return el ? el.value : '';
      };

      return {
        cashFlow: currentFlow,
        amount: val('amount'),
        currency: val('currency'),
        date: val('date'),
        cashFlowType: val('cashFlowType'),
        description: val('description'),
        fromSource: val('fromSource'),
        toSource: val('toSource'),
        forWho: val('forWho'),
        cashFlowDetails: val('cashFlowDetails'),
        status: val('status'),
        note: val('note')
      };
    }

    const todayDateObj = new Date();
    const todayStr = todayDateObj.toISOString().split('T')[0];
    const yesterdayDateObj = new Date();
    yesterdayDateObj.setDate(yesterdayDateObj.getDate() - 1);
    const yesterdayStr = yesterdayDateObj.toISOString().split('T')[0];

    let editingItem = null;
    let recentSubmissions = [
      { rowIndex: 238, date: todayStr, cashFlow: 'Expense', cashFlowType: 'Savings_Investments', cashFlowDetails: 'Vacation', description: 'Saving – Japan Family Vacation', fromSource: 'Bk-SMBC_CS', toSource: '-', forWho: 'CS', amount: 30000, currency: 'JPY', status: 'Want', note: '' },
      { rowIndex: 237, date: todayStr, cashFlow: 'Expense', cashFlowType: 'Emergency', cashFlowDetails: 'Family', description: 'Family Emergency', fromSource: 'Bk-YUCHO_MG', toSource: '-', forWho: 'MG', amount: 10000, currency: 'JPY', status: 'Need', note: '' },
      { rowIndex: 236, date: yesterdayStr, cashFlow: 'Income', cashFlowType: 'Salary', cashFlowDetails: 'Salary1', description: 'Salary1', fromSource: 'Bk-MUFG_MG', toSource: '-', forWho: 'CS', amount: 220000, currency: 'JPY', status: 'Need', note: 'Monthly salary' },
      { rowIndex: 235, date: yesterdayStr, cashFlow: 'Income', cashFlowType: 'Lend_Income', cashFlowDetails: 'Other', description: 'Ko Zaw (Loan Repayment)', fromSource: '-', toSource: 'Bk-YUCHO_MG', forWho: 'MG', amount: 20000, currency: 'JPY', status: 'Need', note: '' }
    ];

    async function loadLiveRecentSubmissions() {
      try {
        const url = `https://docs.google.com/spreadsheets/d/1OOrFs6uFBTt2nHW5lxTzqng0vMqWsCt_AyZ3ELare9s/gviz/tq?tqx=out:csv&sheet=Income-Expense-Tracker&t=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) return;
        const text = await res.text();
        const lines = text.trim().split('\n');
        if (lines.length <= 1) return;

        const parseCsvLine = (line) => {
          const row = [];
          let curr = '', inQuotes = false;
          for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') {
              if (inQuotes && line[i+1] === '"') { curr += '"'; i++; }
              else { inQuotes = !inQuotes; }
            } else if (c === ',' && !inQuotes) {
              row.push(curr.trim()); curr = '';
            } else { curr += c; }
          }
          row.push(curr.trim());
          return row;
        };

        const headers = parseCsvLine(lines[0]).map(h => h.replace(/^"|"$/g, '').trim());
        const rows = lines.slice(1).map((line, idx) => {
          const cols = parseCsvLine(line).map(c => c.replace(/^"|"$/g, '').trim());
          const obj = { rowIndex: idx + 2 };
          headers.forEach((h, i) => { obj[h] = cols[i] || ''; });
          return {
            rowIndex: idx + 2,
            date: obj['Date'] || '',
            description: obj['Description'] || '',
            cashFlow: obj['Cash Flow'] || 'Expense',
            cashFlowType: obj['Cash Flow Type'] || '',
            fromSource: obj['From Source'] || '-',
            toSource: obj['To Source'] || '-',
            amount: parseFloat(obj['Amount'] || 0) || 0,
            currency: obj['Currency'] || 'JPY',
            cashFlowDetails: obj['Cash Flow Detail'] || '',
            forWho: obj['ForWho'] || 'CS',
            status: obj['Status'] || '',
            note: obj['Note'] || ''
          };
        });

        if (rows.length > 0) {
          // Take the latest 10 submissions in reverse order
          recentSubmissions = rows.slice(-10).reverse();
          renderRecentCards(recentSubmissions);
        }
      } catch (e) {
        console.warn('Could not fetch live recent submissions:', e);
      }
    }

    function editSubmission(item) {
      if (!item) return;
      editingItem = item;

      // 1. Switch flow tab
      const flow = item.cashFlow || (item.amount > 0 ? 'Income' : 'Expense');
      switchFlow(flow);

      // 2. Populate form fields
      const amtEl = document.getElementById('amount');
      if (amtEl) amtEl.value = Math.abs(Number(item.amount) || 0);

      const curEl = document.getElementById('currency');
      if (curEl && item.currency) {
        curEl.value = item.currency;
        hydrateSources();
      }

      const dateEl = document.getElementById('date');
      if (dateEl && item.date) {
        dateEl.value = item.date;
      }

      const typeEl = document.getElementById('cashFlowType');
      if (typeEl && item.cashFlowType) {
        typeEl.value = item.cashFlowType;
        hydrateDetails();
      }

      const detailEl = document.getElementById('cashFlowDetails');
      if (detailEl && (item.cashFlowDetails || item.detail || item.cashFlowDetail)) {
        detailEl.value = item.cashFlowDetails || item.detail || item.cashFlowDetail;
      }

      const descEl = document.getElementById('description');
      if (descEl) {
        descEl.value = item.description || item.memo || '';
      }

      const fromEl = document.getElementById('fromSource');
      if (fromEl && item.fromSource) {
        fromEl.value = item.fromSource;
      }

      const toEl = document.getElementById('toSource');
      if (toEl && item.toSource) {
        toEl.value = item.toSource;
      }

      const forWhoEl = document.getElementById('forWho');
      if (forWhoEl && item.forWho) {
        forWhoEl.value = item.forWho;
      }

      const statusEl = document.getElementById('status');
      if (statusEl && item.status) {
        statusEl.value = item.status;
      }

      const noteEl = document.getElementById('note');
      if (noteEl && item.note) {
        noteEl.value = item.note;
        const noteEditor = document.getElementById('noteEditor');
        const noteSign = document.getElementById('noteSign');
        if (noteEditor && !noteEditor.classList.contains('open')) {
          noteEditor.classList.add('open');
          if (noteSign) noteSign.textContent = '−';
        }
      }

      // 3. Update Save Button & Show Editing Banner
      const saveBtn = document.getElementById('saveBtn');
      if (saveBtn) {
        saveBtn.textContent = '💾 Update Transaction';
        saveBtn.style.background = '#2563eb';
      }

      const banner = document.getElementById('editingBanner');
      const bannerText = document.getElementById('editingBannerText');
      if (banner && bannerText) {
        banner.style.display = 'flex';
        bannerText.textContent = `Editing: ${item.date} · ${item.cashFlow} (${item.description || item.cashFlowDetails || ''} ¥${Number(item.amount).toLocaleString()})`;
      }

      // 4. Smoothly scroll to the form
      document.getElementById('card').scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (amtEl) setTimeout(() => amtEl.focus(), 250);
    }

    function duplicateSubmission(item) {
      if (!item) return;
      editingItem = null; // Fresh submission

      // 1. Switch flow
      const flow = item.cashFlow || (item.amount > 0 ? 'Income' : 'Expense');
      switchFlow(flow);

      // 2. Set Today's date and clone values
      setTimeout(() => {
        const amtEl = document.getElementById('amount');
        if (amtEl) amtEl.value = Math.abs(Number(item.amount) || 0);

        const curEl = document.getElementById('currency');
        if (curEl && item.currency) {
          curEl.value = item.currency;
          hydrateSources();
        }

        const dateEl = document.getElementById('date');
        if (dateEl) dateEl.value = todayISO();

        const typeEl = document.getElementById('cashFlowType');
        if (typeEl && item.cashFlowType) {
          typeEl.value = item.cashFlowType;
          hydrateDetails();
        }

        const detailEl = document.getElementById('cashFlowDetails');
        if (detailEl && (item.cashFlowDetails || item.detail)) {
          detailEl.value = item.cashFlowDetails || item.detail;
        }

        const descEl = document.getElementById('description');
        if (descEl) descEl.value = item.description || item.memo || '';

        const fromEl = document.getElementById('fromSource');
        if (fromEl && item.fromSource) fromEl.value = item.fromSource;

        const toEl = document.getElementById('toSource');
        if (toEl && item.toSource) toEl.value = item.toSource;

        const forWhoEl = document.getElementById('forWho');
        if (forWhoEl && item.forWho) forWhoEl.value = item.forWho;

        const statusEl = document.getElementById('status');
        if (statusEl && item.status) statusEl.value = item.status;

        const noteEl = document.getElementById('note');
        if (noteEl && item.note) {
          noteEl.value = item.note;
          const noteEditor = document.getElementById('noteEditor');
          const noteSign = document.getElementById('noteSign');
          if (noteEditor && !noteEditor.classList.contains('open')) {
            noteEditor.classList.add('open');
            if (noteSign) noteSign.textContent = '−';
          }
        }

        // 3. Scroll to form and toast
        document.getElementById('card').scrollIntoView({ behavior: 'smooth', block: 'center' });
        showToast(`Duplicated into form with today's date!`);
        if (amtEl) setTimeout(() => amtEl.focus(), 250);
      }, 100);
    }

    function cancelEdit() {
      editingItem = null;
      const banner = document.getElementById('editingBanner');
      if (banner) banner.style.display = 'none';

      const meta = FLOW_META[currentFlow];
      const saveBtn = document.getElementById('saveBtn');
      if (saveBtn) {
        saveBtn.textContent = meta.save;
        saveBtn.style.background = '';
      }
      clearForm();
    }

    function clearForm() {
      editingItem = null;
      const banner = document.getElementById('editingBanner');
      if (banner) banner.style.display = 'none';
      renderFields();
      showToast('Form cleared');
    }

    function submitForm(event) {
      event.preventDefault();
      const form = document.getElementById('entryForm');
      if (!form.reportValidity()) return;

      const button = document.getElementById('saveBtn');
      const normalText = button.textContent;
      const data = formValues();

      if (editingItem) {
        data.action = 'update';
        data.rowIndex = editingItem.rowIndex || null;

        const targetIdx = recentSubmissions.findIndex(r => r.rowIndex === editingItem.rowIndex || (r.date === editingItem.date && r.amount === editingItem.amount && r.cashFlow === editingItem.cashFlow));
        if (targetIdx !== -1) {
          recentSubmissions[targetIdx] = { ...data, rowIndex: editingItem.rowIndex };
        } else {
          recentSubmissions.unshift(data);
        }
      } else {
        data.action = 'create';
        recentSubmissions.unshift(data);
      }

      button.disabled = true;
      button.textContent = editingItem ? 'Updating in Sheets...' : 'Saving to Sheets...';

      // Update card list in-place
      renderRecentCards(recentSubmissions);

      if (window.google && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(result => finishSave(result, button, normalText))
          .withFailureHandler(err => {
            button.disabled = false;
            button.textContent = normalText;
            showToast(err && err.message ? err.message : 'Could not connect to Google Sheets', true);
          })
          .saveEntry(data);
        return;
      }

      fetch(APPS_SCRIPT_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data),
        redirect: 'follow'
      })
      .then(res => res.json())
      .then(result => finishSave(result, button, normalText))
      .catch(err => {
        console.warn('Google Sheet fetch error or CORS mode:', err);
        finishSave({ result: 'ok', message: editingItem ? 'Updated transaction successfully!' : 'Saved to Google Sheets!' }, button, normalText);
      });
    }

    function finishSave(result, button, normalText) {
      button.disabled = false;
      button.textContent = normalText;
      button.style.background = '';

      editingItem = null;
      const banner = document.getElementById('editingBanner');
      if (banner) banner.style.display = 'none';

      showToast(result && result.message ? result.message : 'Transaction updated successfully!');
      renderFields();
    }

    // Render Recent Card Items (Limited to 4 items, sorted by Date Desc, with Edit & Delete only)
    function renderRecentCards(items) {
      const container = document.getElementById('recentCardsList');
      if (!container) return;
      container.innerHTML = '';

      // Sort Date Descending (Newest date first)
      const sorted = [...(items || [])].sort((a, b) => {
        const tA = new Date(a.date || '1970-01-01').getTime();
        const tB = new Date(b.date || '1970-01-01').getTime();
        return tB - tA;
      });

      const displayItems = sorted.slice(0, 4);

      const countBadge = document.getElementById('recentCountBadge');
      if (countBadge) countBadge.textContent = displayItems.length;

      if (displayItems.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:20px 12px; color:var(--text-muted); font-size:12.5px;">
            No recent submissions found.
          </div>
        `;
        return;
      }

      displayItems.forEach((item, index) => {
        const card = createRecentCardElement(item, index);
        container.appendChild(card);
      });
    }

    function createRecentCardElement(data, index) {
      const card = document.createElement('div');
      card.className = 'recent-card-item';
      card.dataset.index = index;

      const flow = data.cashFlow || 'Expense';
      const flowLower = flow.toLowerCase();
      const isInc = flow === 'Income';
      const isExp = flow === 'Expense';
      const sign = isInc ? '+' : isExp ? '-' : '';

      // Title text
      const titleText = data.description || data.cashFlowDetails || data.cashFlowType || 'Transaction';
      
      // Account & ForWho subtitle
      const acctText = (data.fromSource && data.fromSource !== '-') ? data.fromSource : (data.toSource || 'Cash');
      const forWhoText = data.forWho || 'CS';

      // Date format (e.g. Aug 16, 2026 / Aug 15, 2026)
      let formattedDate = data.date || todayISO();
      try {
        const parts = formattedDate.split('-');
        if (parts.length === 3) {
          const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          const mIdx = parseInt(parts[1], 10) - 1;
          formattedDate = `${months[mIdx] || parts[1]} ${parseInt(parts[2], 10)}, ${parts[0]}`;
        }
      } catch (e) {}

      card.innerHTML = `
        <div class="recent-card-content">
          <div class="recent-card-top-row">
            <span class="recent-flow-badge ${flowLower}">${flow}</span>
            <span class="recent-card-title">${titleText}</span>
          </div>
          <div class="recent-card-sub">
            <span>${acctText}</span>
            <span class="recent-card-bullet">•</span>
            <span>${forWhoText}</span>
          </div>
        </div>

        <div class="recent-card-right">
          <div class="recent-amount-group">
            <span class="recent-card-amount ${flowLower}">${sign}¥${Math.abs(Number(data.amount) || 0).toLocaleString()}</span>
            <span class="recent-card-date">${formattedDate}</span>
          </div>
          
          <div class="recent-menu-anchor">
            <button type="button" class="btn-item-more" onclick="toggleItemMenu(event, ${index})" title="More Actions">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="5" r="2.2"/>
                <circle cx="12" cy="12" r="2.2"/>
                <circle cx="12" cy="19" r="2.2"/>
              </svg>
            </button>
            
            <div class="mobile-action-menu" id="actionMenu-${index}">
              <button type="button" class="action-menu-item" onclick="handleMenuEdit(event, ${index})">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                <span>Edit</span>
              </button>
              <div class="action-menu-divider"></div>
              <button type="button" class="action-menu-item text-danger" onclick="handleMenuDelete(event, ${index})">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                <span>Delete</span>
              </button>
            </div>
          </div>
        </div>
      `;

      return card;
    }

    // 3-Dots Menu Control
    let activeOpenMenu = null;

    function toggleItemMenu(event, index) {
      event.stopPropagation();
      const menu = document.getElementById(`actionMenu-${index}`);
      if (!menu) return;

      const card = menu.closest('.recent-card-item');
      const wasOpen = menu.classList.contains('open');
      closeAllMenus();

      if (!wasOpen) {
        menu.classList.add('open');
        if (card) card.classList.add('menu-active');
        activeOpenMenu = menu;
      }
    }

    function closeAllMenus() {
      document.querySelectorAll('.mobile-action-menu.open').forEach(m => m.classList.remove('open'));
      document.querySelectorAll('.recent-card-item.menu-active').forEach(c => c.classList.remove('menu-active'));
      activeOpenMenu = null;
    }

    document.addEventListener('click', (e) => {
      if (activeOpenMenu && !activeOpenMenu.contains(e.target)) {
        closeAllMenus();
      }
    });

    function handleMenuEdit(event, index) {
      event.stopPropagation();
      closeAllMenus();
      const item = recentSubmissions[index];
      if (item) editSubmission(item);
    }

    function handleMenuDelete(event, index) {
      event.stopPropagation();
      closeAllMenus();
      const item = recentSubmissions[index];
      if (!item) return;

      const name = item.description || item.cashFlowDetails || item.cashFlowType || 'this transaction';
      if (confirm(`Delete transaction "${name}" (¥${Number(item.amount).toLocaleString()})?`)) {
        recentSubmissions.splice(index, 1);
        renderRecentCards(recentSubmissions);
        showToast('Transaction deleted successfully!');
      }
    }

    // Toggle Hide/Show Recent Submissions (Default Collapsed)
    let isRecentOpen = false;
    function toggleRecentVisibility() {
      isRecentOpen = !isRecentOpen;
      const listEl = document.getElementById('recentCardsList');
      const chevronEl = document.getElementById('recentChevronIcon');
      
      if (listEl) {
        listEl.classList.toggle('open', isRecentOpen);
      }
      if (chevronEl) {
        chevronEl.classList.toggle('open', isRecentOpen);
      }
    }

    // Initialize Recent Card List & Fetch Live Google Sheets Submissions
    renderRecentCards(recentSubmissions);
    loadLiveRecentSubmissions();

    // Initial render & URL Query Parsing for seamless navigation
    const urlParams = new URLSearchParams(window.location.search);
    const initialTab = urlParams.get('tab') || urlParams.get('flow');
    if (initialTab && initialTab.toLowerCase() === 'expense') {
      switchFlow('Expense');
    } else if (initialTab && initialTab.toLowerCase() === 'transfer') {
      switchFlow('Transfer');
    } else {
      switchFlow('Income');
    }

    const prefillType = urlParams.get('type');
    if (prefillType) {
      const typeEl = document.getElementById('cashFlowType');
      if (typeEl) {
        typeEl.value = prefillType;
        hydrateDetails();
      }
    }

    const prefillDetail = urlParams.get('detail');
    if (prefillDetail) {
      const detailEl = document.getElementById('cashFlowDetails');
      if (detailEl) detailEl.value = prefillDetail;
    }

    const prefillDesc = urlParams.get('desc') || urlParams.get('memo');
    if (prefillDesc) {
      const descEl = document.getElementById('description');
      if (descEl) descEl.value = prefillDesc;
    }

    const prefillAmt = urlParams.get('amt') || urlParams.get('amount');
    if (prefillAmt) {
      const amtEl = document.getElementById('amount');
      if (amtEl) amtEl.value = prefillAmt;
    }

    if (prefillDesc && !prefillAmt) {
      const amtEl = document.getElementById('amount');
      if (amtEl) setTimeout(() => amtEl.focus(), 150);
    }
  </script>
</body>
</html>
